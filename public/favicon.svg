<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Saytın öz tokenləri: kağız fon + terracotta aksent. Temaya görə özü uyğunlaşır. -->
  <style>
    .bg   { fill: #f4f1ea; }
    .mark { fill: #c2502e; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #16181d; }
      .mark { fill: #e0673f; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <text class="mark" x="32" y="46"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="600">R</text>
</svg>
